name: Go Quality Assurance

on:
  push:
    branches: [ "main", "vuln-check" ] 
  pull_request:
    branches: [ "**" ]

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    
    defaults:
      run:
        # プロジェクトのルートディレクトリを指定します
        working-directory: .

    steps:
    - name: Checkout Code
      uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.25'
        cache: false

    - name: Verify Dependencies
      run: go mod verify

    - name: Check Format
      run: |
        if [ -n "$(gofmt -l .)" ]; then
          echo "Error: Code is not formatted. Run 'go fmt ./...' locally."
          gofmt -l .
          exit 1
        fi

    - name: Static Analysis
      run: go vet ./...

    # 追加: セキュアコーディングガイドラインに沿った脆弱性チェック
    - name: Security Vulnerability Scanner (gosec)
      uses: securego/gosec@master
      with:
        args: ./...

    - name: Build (Fowler's CI)
      run: go build -v ./...

    - name: Run Tests with Coverage
      run: go test -v -race -covermode=atomic ./...