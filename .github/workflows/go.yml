name: Go Quality Assurance

on:
  push:
    branches: [ "main", "vuln-check" ] 
  pull_request:
    branches: [ "**" ]

jobs:
  quality-gate:
    # 実行中の画面でどちらのフォルダのテストかわかるように名前を変えます
    name: Quality Gate (${{ matrix.workdir }})
    runs-on: ubuntu-latest
    
    # ここがポイント！対象のフォルダをリストアップします
    strategy:
      fail-fast: false # 片方が失敗しても、もう片方のテストを最後まで実行します
      matrix:
        workdir: [ "algorithm", "design_patterns" ]

    defaults:
      run:
        # マトリックスで指定したフォルダ名がここに自動で入ります
        working-directory: ${{ matrix.workdir }}

    steps:
    - name: Checkout Code
      # ※事実に基づく補足: 2026年現在、actions/checkoutの安定最新版はv4です。
      # エラーを防ぐため、存在している安全なバージョンを指定しています。
      uses: actions/checkout@v4

    - name: Set up Go
      # こちらも現在の安定最新版であるv5を指定しています。
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'
        cache: false

    - name: Verify Dependencies
      run: go mod verify

    - name: Check Format
      run: |
        if [ -n "$(gofmt -l .)" ]; then
          echo "Error: Code is not formatted. Run 'go fmt ./...' locally."
          gofmt -l .
          exit 1
        fi

    - name: Static Analysis
      run: go vet ./...

    - name: Security Vulnerability Scanner (gosec)
      uses: securego/gosec@master
      with:
        args: ./...

    - name: Build (Fowler's CI)
      run: go build -v ./...

    - name: Run Tests with Coverage
      run: go test -v -race -covermode=atomic ./...