name: Go Quality Assurance

on:
  push:
    branches: [ "main", "vuln-check" ] 
  pull_request:
    branches: [ "**" ]

jobs:
  quality-gate:
    # 実行中の画面でどちらのフォルダのテストかわかるように名前を変えます
    name: Quality Gate (${{ matrix.workdir }})
    runs-on: ubuntu-latest
    
    # ここがポイント！対象のフォルダをリストアップします
    strategy:
      fail-fast: false # 片方が失敗しても、もう片方のテストを最後まで実行します
      matrix:
        workdir: [ "algorithm", "design_patterns" ]

    defaults:
      run:
        # マトリックスで指定したフォルダ名がここに自動で入ります
        working-directory: ${{ matrix.workdir }}

    steps:
    - name: Checkout Code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0

    - name: Verify Dependencies
      run: go mod verify

    - name: Check Format
      run: |
        if [ -n "$(gofmt -l .)" ]; then
          echo "Error: Code is not formatted. Run 'go fmt ./...' locally."
          gofmt -l .
          exit 1
        fi

    - name: Static Analysis
      run: go vet ./...

    - name: Security Vulnerability Scanner (gosec)
      uses: securego/gosec@deb54465fea23d19a77f037e11e6589021f8501d # v2.29.0
      with:
        args: ./...

    - name: Build (Fowler's CI)
      run: go build -v ./...

    - name: Run Tests with Coverage
      run: go test -v -race -covermode=atomic ./...
